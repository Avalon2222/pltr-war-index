name: Perbarui data

on:
  schedule:
    - cron: "23 3 * * 1"   # tiap Senin 03:23 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  perbarui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Unduh harga saham terbaru
        run: python -m src.ambil_harga
      - name: Unduh dan ringkas UCDP
        run: python -m src.siapkan_konflik
      - name: Pastikan data masih lolos tes
        run: python -m pytest tests/ -q
      - name: Commit jika ada perubahan
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/*.csv
          git diff --cached --quiet && echo "Tidak ada perubahan" || (git commit -m "Perbarui data mingguan" && git push)
